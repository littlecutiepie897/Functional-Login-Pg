<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Secure Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <span class="wordmark">Secure Portal</span>

  <h2>Create Account</h2>
  <p class="subtitle">Join our secure environment</p>

  <div class="field">
    <label for="reg-username">Email</label>
    <input type="text" id="reg-username" placeholder="name@example.com">
  </div>

  <div class="field">
    <label for="reg-password">Password</label>
    <input type="password" id="reg-password" placeholder="••••••••">
  </div>

  <div class="field">
    <label for="confirm-password">Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="••••••••">
  </div>

  <button onclick="handleSignup()"><span>Register →</span></button>

  <p id="msgBox" style="display:none; margin-top:14px; font-size:12px; letter-spacing:0.05em;"></p>

  <div class="links">
    <a href="index.html">Already have an account? Sign in</a>
  </div>
</div>
<script src="script3.js"></script>
</body>
</html>
