<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">
  <span class="wordmark">Secure Portal</span>

  <h1>Welcome back.</h1>
  <p class="subtitle">You have authenticated successfully</p>

  <div class="status-row">
    <div class="status-dot"></div>
    <span>Session active</span>
  </div>

  <button class="logout-btn" onclick="logout()"><span>Sign Out</span></button>
</div>

<script src="script.js"></script>
</body>
</html>
